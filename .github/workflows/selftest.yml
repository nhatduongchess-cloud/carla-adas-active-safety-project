name: self-test

# Runs the CARLA-free geometry + safety-FSM self-test on every push / PR.
# selftest.py depends only on NumPy, so no simulator or GPU is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run self-test (70 checks)
        run: python selftest.py

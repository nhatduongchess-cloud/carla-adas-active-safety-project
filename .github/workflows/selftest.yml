name: CI

# Three CARLA-free gates on every push / PR:
#   lint      - ruff correctness gate (pyflakes F + syntax E9 + bugbear B)
#   typecheck - mypy on the safety-evidence core
#   selftest  - selftest.py geometry + safety-FSM checks (190)
# The full unit-test suite (test_*.py) imports the CARLA client / PyTorch and
# runs in the local CARLA environment, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff (correctness lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  typecheck:
    name: Mypy (safety-evidence core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip mypy numpy
      - run: mypy

  selftest:
    name: Self-test (190 CARLA-free checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install self-test dependencies
        run: python -m pip install --upgrade pip numpy pyyaml opencv-python-headless scikit-learn pillow
      - name: Run self-test
        run: python selftest.py

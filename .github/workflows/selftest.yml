name: CI

# Four CARLA-free gates on every push / PR:
#   lint      - ruff correctness gate (pyflakes F + syntax E9 + bugbear B)
#   typecheck - mypy on the safety-evidence core
#   selftest  - selftest.py geometry + safety-FSM checks (209)
#   offline-tests - the test_*.py modules that need no CARLA client
# Six modules in tests/ import the CARLA client and cannot run here
# (test_capture_lifecycle, test_dataset_capture, test_ego_control,
# test_junction_route, test_road_waypoints, test_sensor_runtime); those stay in
# the local CARLA environment. Everything else now runs on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff (correctness lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  typecheck:
    name: Mypy (safety-evidence core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip mypy numpy
      - run: mypy

  selftest:
    name: Self-test (209 CARLA-free checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install self-test dependencies
        run: python -m pip install --upgrade pip -r requirements-selftest.txt
      - name: Run self-test
        run: python selftest.py

  offline-tests:
    name: Unit tests that run without CARLA (237 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install self-test dependencies
        run: python -m pip install --upgrade pip -r requirements-selftest.txt
      # The list is explicit, not a discovery glob, because `unittest discover`
      # would also pick up the six modules that import the CARLA client and the
      # job would fail for an environment reason rather than a code one. Adding
      # a new offline test file means adding it here; that is the cost of having
      # this job mean something.
      - name: Run the offline unit-test group
        run: >
          python -m unittest
          tests.test_audit_training_dataset
          tests.test_carla_probe
          tests.test_dataset_labels
          tests.test_decision_trace
          tests.test_evidence_remediation
          tests.test_evidence_review
          tests.test_image_quality
          tests.test_inference_telemetry
          tests.test_launch_carla
          tests.test_neural_decoupling
          tests.test_perception_contracts
          tests.test_pipeline_metrics
          tests.test_runtime_cleanup
          tests.test_runtime_config
          tests.test_runtime_report
          tests.test_safety_geometry
          tests.test_sensor_sync
          tests.test_validate_dataset
